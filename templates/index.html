<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-powered University Student Services FAQ Assistant using local NLP, TF-IDF, and Cosine Similarity.">
  <title>FAQ AI Assistant - CodeAlpha AI Internship</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
</head>
<body>
  <div class="app-container">
    <!-- Main Chat Window Card -->
    <main class="chat-card" role="region" aria-label="FAQ AI Assistant Chat Interface">

      <!-- Header -->
      <header class="chat-header">
        <div class="header-left">
          <div class="bot-avatar-badge" aria-hidden="true">
            <svg class="icon-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8V4H8"></path>
              <rect width="16" height="12" x="4" y="8" rx="2"></rect>
              <path d="M2 14h2"></path>
              <path d="M20 14h2"></path>
              <path d="M15 13v2"></path>
              <path d="M9 13v2"></path>
            </svg>
            <span class="status-dot" title="System Online"></span>
          </div>
          <div class="header-titles">
            <div class="title-row">
              <h1 class="chat-title">FAQ AI Assistant</h1>
              <span class="badge-tag">NLP • TF-IDF</span>
            </div>
            <p class="chat-subtitle">AI-powered Student Services Assistant</p>
          </div>
        </div>

        <div class="header-actions">
          <button id="clearChatBtn" class="btn-secondary" title="Reset chat conversation history" aria-label="Reset chat conversation history">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>Reset Chat</span>
          </button>
        </div>
      </header>

      <!-- Knowledge Base Topic Banner -->
      <section class="topic-banner" aria-label="Knowledge base status">
        <div class="topic-indicator">
          <span class="topic-label">Knowledge Base:</span>
          <span class="topic-name">College &amp; Student Affairs</span>
        </div>
        <div class="topic-metrics" id="kbMetrics">
          <span class="metric-pill" id="faqCountPill">36 FAQs</span>
          <span class="metric-pill status-online" id="statusPill"><span class="status-indicator-dot"></span>Online</span>
        </div>
      </section>

      <!-- Chat History Area -->
      <section id="chatMessages" class="chat-messages" aria-live="polite" aria-label="Chat messages history">
        <!-- Messages dynamically rendered here -->
      </section>

      <!-- Suggestion Chips Tray -->
      <section class="suggestions-section" id="suggestionsContainer" aria-label="Suggested questions">
        <div class="suggestions-header">
          <p class="suggestions-title">
            <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            Suggested Questions:
          </p>
          <span class="suggestions-hint">Click any question to ask</span>
        </div>
        <div class="chips-list" id="chipsList" role="toolbar" aria-label="Quick suggested question buttons">
          <!-- Dynamic suggestion chips inserted via JavaScript -->
        </div>
      </section>

      <!-- Chat Input Area -->
      <footer class="chat-footer">
        <form id="chatForm" class="chat-input-form" onsubmit="return false;">
          <div class="input-wrapper">
            <label for="userInput" class="sr-only">Ask a student services question</label>
            <input
              type="text"
              id="userInput"
              name="message"
              placeholder="Ask about admissions, fees, exams, scholarships, attendance..."
              autocomplete="off"
              maxlength="500"
              required
              aria-label="Ask about admissions, fees, exams, scholarships, attendance..."
            />
            <button type="submit" id="sendBtn" class="btn-send" aria-label="Send question">
              <span>Send</span>
              <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </form>
        <div class="input-hints">
          <span>Press <strong>Enter</strong> to send • Matches retrieved locally via TF-IDF vectorization &amp; cosine similarity</span>
        </div>
      </footer>

    </main>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
